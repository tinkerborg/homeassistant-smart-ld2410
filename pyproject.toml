[project]
name = "homeassistant-smart-ld2410"
version = "0.0.0"
# Home Assistant 2026.7+ requires Python 3.14.2; without this, uv's universal
# lock falls back to an old HA that lacks current test APIs.
requires-python = ">=3.14.2"

[tool.uv]
package = false

[dependency-groups]
lint = [
  "ruff==0.15.12",
]
test = [
  "pytest-homeassistant-custom-component",
  "pytest-cov",
  "aiousbwatcher==1.1.2",
  "serialx==1.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.smart_ld2410 --cov-report=term-missing"
